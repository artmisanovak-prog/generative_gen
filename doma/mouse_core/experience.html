<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experience Store · MOUSE CORE</title><style>
:root{--p:#10212c;--l:#29414d;--i:#edf4f5;--m:#a9bbc2;--c:#78dbe5;--g:#edc58c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#332b54,#08131b 60%);color:var(--i);font:15px/1.6 system-ui}main{max-width:1000px;margin:auto;padding:30px 18px 60px}a{color:var(--c)}h1{font:300 clamp(36px,7vw,60px)/1 Georgia;margin:12px 0}.box{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:18px;margin:14px 0}label{display:block;color:var(--g);font-size:12px;margin:10px 0 4px}input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--l);background:#091821;color:var(--i);font:inherit}textarea{min-height:85px}button{background:#173644;color:var(--i);border:1px solid #47717e;border-radius:8px;padding:10px 14px;margin:8px 6px 0 0;font:inherit;cursor:pointer}.entry{border-top:1px solid var(--l);padding:12px 0}.muted{color:var(--m);font-size:13px}
</style></head><body><main><a href="index.html">← MOUSE CORE</a><h1>Experience Store</h1><p class="muted">Archiv zkušeností pro opakované použití. Záznam není automaticky pravdivé pravidlo: ukládá i nejistotu, neúspěch a podmínky platnosti.</p>
<div class="box"><h2>Nová zkušenost</h2><label>Název</label><input id="title" placeholder="např. Změna role mění význam signálu"><label>Doména / zdroj</label><input id="domain" placeholder="pohádka, ilustrace, ARC úloha..."><label>Typ záznamu</label><select id="type"><option>pozorování</option><option>hypotéza pravidla</option><option>ověřené pravidlo</option><option>neúspěšný pokus</option><option>přenos do jiné domény</option><option>otevřená otázka</option></select><label>Obsah zkušenosti</label><textarea id="body" placeholder="Co se stalo? Jaké pravidlo se ukázalo?"></textarea><label>Podmínky a omezení</label><textarea id="conditions" placeholder="Kdy pravidlo platí a kdy nemusí?"></textarea><label>Jistota</label><select id="confidence"><option value="low">nízká</option><option value="medium" selected>střední</option><option value="high">vysoká</option></select><button id="add">Uložit zkušenost</button><button id="export">Export JSON</button><label>Importovat dříve exportovaný archiv</label><input id="import" type="file" accept=".json,application/json"></div>
<div class="box"><h2>Uložené zkušenosti</h2><div id="list" class="muted"></div></div><footer><a href="index.html">MOUSE CORE</a> · <a href="../../index.html">generative_gen</a></footer></main>
<script>
const KEY='mouse_core_experience_v1', $=id=>document.getElementById(id);let records=[];try{records=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(KEY,JSON.stringify(records));render()}function render(){$('list').innerHTML=records.length?records.map((r,i)=>'<div class="entry"><b>'+esc(r.title)+'</b><div class="muted">'+esc(r.type)+' · '+esc(r.domain)+' · jistota: '+esc(r.confidence)+' · '+new Date(r.created_at).toLocaleString('cs-CZ')+'</div><p>'+esc(r.body)+'</p><p class="muted">Podmínky: '+esc(r.conditions||'neuvedeny')+'</p><button data-del="'+i+'">Odstranit</button></div>').join(''):'Archiv je zatím prázdný.'}
$('add').onclick=()=>{if(!$('title').value.trim()||!$('body').value.trim()){alert('Vyplň název a obsah zkušenosti.');return}records.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:$('title').value.trim(),domain:$('domain').value.trim(),type:$('type').value,body:$('body').value.trim(),conditions:$('conditions').value.trim(),confidence:$('confidence').value,created_at:new Date().toISOString()});save();['title','domain','body','conditions'].forEach(x=>$(x).value='')};
$('list').onclick=e=>{if(e.target.dataset.del!==undefined){records.splice(Number(e.target.dataset.del),1);save()}};
$('export').onclick=()=>download({schema:'mouse-core-experience-v1',exported_at:new Date().toISOString(),records});
$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),incoming=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(incoming))throw Error('V souboru není pole records.');records=[...incoming,...records];save();alert('Importováno '+incoming.length+' záznamů.')}catch(err){alert('Import se nezdařil: '+err.message)}e.target.value=''};
function download(obj){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=u;a.download='mouse-core-experience.json';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
