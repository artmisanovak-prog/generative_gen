<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gap Workspace · MOUSE CORE</title><style>
:root{--bg:#08131b;--p:#10212c;--l:#29414d;--i:#edf4f5;--m:#a9bbc2;--c:#78dbe5;--g:#edc58c;--v:#c5b4f2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292744,#08131b 60%);color:var(--i);font:15px/1.6 system-ui}main{max-width:1050px;margin:auto;padding:30px 18px 60px}a{color:var(--c)}h1{font:300 clamp(36px,7vw,60px)/1 Georgia;margin:12px 0}p,.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.box{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:17px;margin:12px 0}label{display:block;color:var(--g);font-size:12px;margin:10px 0 4px}input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid var(--l);background:#091821;color:var(--i);font:inherit}textarea{min-height:90px;resize:vertical}button{background:#173644;color:var(--i);border:1px solid #47717e;border-radius:8px;padding:10px 14px;margin:8px 6px 0 0;font:inherit;cursor:pointer}button:hover{border-color:var(--c)}.item{border-top:1px solid var(--l);padding:12px 0}.item b{color:var(--c)}.small{font-size:12px;color:var(--m)}.danger{border-color:#805b5b}footer{margin-top:25px;border-top:1px solid var(--l);padding-top:18px;font-size:12px}
</style></head><body><main><a href="index.html">← MOUSE CORE</a><h1>Gap Workspace</h1><p>Relační zápis mezi fenomény. Každý záznam rozlišuje pozorovatelný zdroj, interpretaci a otevřenou hypotézu. Data se ukládají v tomto prohlížeči.</p>
<div class="box"><h2>Nový vztah</h2><div class="grid"><div><label>Zdroj / fenomén A</label><input id="a" placeholder="např. pohádka Myš"></div><div><label>Cíl / fenomén B</label><input id="b" placeholder="např. ARC úloha 014"></div><div><label>Typ vztahu</label><select id="rel"><option>analogie</option><option>kontrast</option><option>opakující se pravidlo</option><option>příčina / následek</option><option>transformace</option><option>rozpor</option><option>neznámý vztah</option></select></div><div><label>Úhel / perspektiva</label><select id="angle"><option>Analytický</option><option>Kulturní</option><option>Filozofický</option><option>Naivní</option><option>Jazykový</option><option>Metaforický</option><option>Asociační</option><option>Introspektivní</option><option>Ironický</option><option>Groteskní</option><option>Absurdní</option><option>Surrealistický</option></select></div></div>
<label>Pozorování (co je přímo ve zdroji?)</label><textarea id="obs" placeholder="Popiš konkrétní důkaz, nikoli závěr."></textarea><label>Interpretace (co z toho vyvozuješ?)</label><textarea id="interp" placeholder="Jaký význam nebo vztah se nabízí?"></textarea><label>Mezera / otevřená otázka</label><textarea id="gap" placeholder="Co zatím nevíme? Co by mohlo interpretaci vyvrátit?"></textarea><label>Stav tvrzení</label><select id="status"><option>hypotéza</option><option>podloženo zdrojem</option><option>ověřeno testem</option><option>vyvráceno</option></select><button id="save">Uložit vztah</button><button id="export">Exportovat JSON</button><button id="clear" class="danger">Smazat lokální záznamy</button></div>
<div class="box"><h2>Mapa zaznamenaných vztahů</h2><div id="list" class="muted">Zatím bez záznamů.</div></div><footer><a href="index.html">MOUSE CORE</a> · <a href="../../index.html">generative_gen</a></footer></main>
<script>
const KEY='mouse_core_gap_v1';let rows=[];try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rows=[]}
const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(rows));render()}
function render(){$('list').innerHTML=rows.length?rows.map((r,i)=>'<div class="item"><b>'+esc(r.a)+' ↔ '+esc(r.b)+'</b><div class="small">'+esc(r.rel)+' · '+esc(r.angle)+' · '+esc(r.status)+' · '+esc(r.date)+'</div><p><b>Pozorování:</b> '+esc(r.obs||'—')+'</p><p><b>Interpretace:</b> '+esc(r.interp||'—')+'</p><p><b>Mezera:</b> '+esc(r.gap||'—')+'</p><button data-del="'+i+'">Odstranit</button></div>').join(''):'Zatím bez záznamů.'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('save').onclick=()=>{if(!$('a').value.trim()||!$('b').value.trim()){alert('Vyplň zdroj A i cíl B.');return}rows.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),a:$('a').value.trim(),b:$('b').value.trim(),rel:$('rel').value,angle:$('angle').value,obs:$('obs').value.trim(),interp:$('interp').value.trim(),gap:$('gap').value.trim(),status:$('status').value,date:new Date().toISOString()});persist();['a','b','obs','interp','gap'].forEach(id=>$(id).value='')};
$('list').onclick=e=>{if(e.target.dataset.del!==undefined){rows.splice(Number(e.target.dataset.del),1);persist()}};
$('export').onclick=()=>download('mouse-core-gap.json',{schema:'mouse-core-gap-v1',exported_at:new Date().toISOString(),records:rows});
$('clear').onclick=()=>{if(confirm('Opravdu smazat všechny lokální vztahy?')){rows=[];persist()}};
function download(name,obj){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
